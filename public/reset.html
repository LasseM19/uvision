<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset UVision</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #ffffff;
        color: #1a1a1a;
        text-align: center;
      }

      button {
        margin-top: 1rem;
        border: none;
        border-radius: 12px;
        padding: 0.875rem 1.25rem;
        background: #ff6b35;
        color: #ffffff;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Reset UVision</h1>
      <p id="status">Tap below if the app stays blank on your phone.</p>
      <button type="button" id="reset">Clear cache and reopen app</button>
    </div>
    <script>
      document.getElementById('reset').addEventListener('click', async function () {
        const status = document.getElementById('status')
        status.textContent = 'Clearing cached data…'

        try {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations()
            await Promise.all(registrations.map(function (registration) {
              return registration.unregister()
            }))
          }

          if ('caches' in window) {
            const keys = await caches.keys()
            await Promise.all(keys.map(function (key) {
              return caches.delete(key)
            }))
          }

          localStorage.clear()
        } catch (error) {
          status.textContent = 'Could not clear everything, reopening anyway…'
        }

        window.location.replace('/')
      })
    </script>
  </body>
</html>
