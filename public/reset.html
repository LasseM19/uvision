<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset UVision</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #ffffff;
        color: #1a1a1a;
        text-align: center;
      }

      button,
      a.button {
        display: inline-block;
        margin-top: 1rem;
        border: none;
        border-radius: 12px;
        padding: 0.875rem 1.25rem;
        background: #ff6b35;
        color: #ffffff;
        font: inherit;
        font-weight: 600;
        text-decoration: none;
      }

      a.link {
        display: block;
        margin-top: 1rem;
        color: #ff6b35;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Reset UVision</h1>
      <p id="status">Clearing old Safari cache…</p>
      <a class="link" href="/safari-fix.html">Manual Safari steps</a>
    </div>
    <script>
      ;(async function () {
        var status = document.getElementById('status')

        try {
          if ('serviceWorker' in navigator) {
            var registrations = await navigator.serviceWorker.getRegistrations()
            await Promise.all(
              registrations.map(function (registration) {
                return registration.unregister()
              }),
            )
          }

          if ('caches' in window) {
            var keys = await caches.keys()
            await Promise.all(
              keys.map(function (key) {
                return caches.delete(key)
              }),
            )
          }
        } catch (error) {
          status.textContent = 'Automatic reset failed. Use manual Safari steps below.'
          return
        }

        status.textContent = 'Done. Opening UVision…'
        window.setTimeout(function () {
          window.location.replace('/?fresh=1')
        }, 800)
      })()
    </script>
  </body>
</html>
