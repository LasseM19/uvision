<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="UVision" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>UVision</title>
    <style>
      html,
      body {
        margin: 0;
        background: #ffffff;
        color: #1a1a1a;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      .boot-screen {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 1.5rem;
        text-align: center;
      }

      .boot-screen p {
        margin: 0;
        color: #6b7280;
      }

      .boot-screen a {
        color: #ff6b35;
        font-weight: 600;
      }
    </style>
    <script>
      ;(function () {
        if (!window.crypto) window.crypto = {}
        if (!window.crypto.randomUUID) {
          window.crypto.randomUUID = function () {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
              var r = (Math.random() * 16) | 0
              var v = c === 'x' ? r : (r & 0x3) | 0x8
              return v.toString(16)
            })
          }
        }

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) {
              reg.unregister()
            })
          })
        }

        if ('caches' in window) {
          caches.keys().then(function (keys) {
            keys.forEach(function (key) {
              caches.delete(key)
            })
          })
        }
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" id="boot-fallback">
        <strong>UVision</strong>
        <p id="boot-status">Loading…</p>
        <p>
          <a href="/reset.html">Stuck? Reset the app</a>
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.setTimeout(function () {
        var status = document.getElementById('boot-status')
        if (status && status.textContent === 'Loading…') {
          status.textContent = 'Still loading… try Reset the app below, or reload the page.'
        }
      }, 8000)
    </script>
    <noscript>
      <div class="boot-screen">
        <strong>UVision</strong>
        <p>JavaScript is required. Please enable it in your browser settings.</p>
      </div>
    </noscript>
  </body>
</html>
