<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="UVision" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>UVision</title>
    <style>
      html,
      body {
        margin: 0;
        background: #ffffff;
        color: #1a1a1a;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      .boot-screen {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 1.5rem;
        text-align: center;
      }

      .boot-screen p {
        margin: 0;
        color: #6b7280;
      }

      .boot-screen a {
        color: #ff6b35;
        font-weight: 600;
      }
    </style>
    <script>
      ;(function () {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (reg) {
                reg.unregister()
              })
            })
          }
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              keys.forEach(function (key) {
                caches.delete(key)
              })
            })
          }
        } catch (e) {
          /* ignore */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" id="boot-fallback">
        <strong>UVision</strong>
        <p id="boot-status">Loading…</p>
        <p><a href="/safari-fix.html">Safari blank? Fix here</a></p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>
      <div class="boot-screen">
        <strong>UVision</strong>
        <p>JavaScript is required.</p>
        <p><a href="/safari-fix.html">Safari fix</a></p>
      </div>
    </noscript>
  </body>
</html>
